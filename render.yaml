services:
  - type: web
    name: registration-ia-laravel
    env: php # 👈 ESTO OBLIGA A RENDER A USAR PHP SÍ O SÍ
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader --no-interaction && npm install && npm run build"
    startCommand: "heroku-php-apache2 public/"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr