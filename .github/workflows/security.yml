name: Laravel Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PASO 1: ENTORNO PHP Y DEPENDENCIAS
      # ==========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # ==========================================
      # PASO 2: TESTS DEL PROYECTO
      # ==========================================
      - name: Run Laravel tests
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env
          php artisan migrate --force
          php artisan test

      # ==========================================
      # PASO 3: AUDITORÍA NATIVA DE PAQUETES PHP
      # ==========================================
      - name: Run Composer Audit
        # Escanea los paquetes del composer.lock contra la base de datos nativa de PHP
        run: composer audit --locked

      # ==========================================
      # PASO 4: ANÁLISIS ESTÁTICO DE CÓDIGO (SAST)
      # ==========================================
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        # El flag --error hace que el pipeline falle automáticamente si encuentra fallas críticas de seguridad
        run: semgrep --config=auto . --error

      # ==========================================
      # PASO 5: GOOGLE OSV SCANNER (SCA RÁPIDO SIN TOKENS)
      # ==========================================
      - name: Run Open Source Vulnerability Scanner
        uses: google/osv-scanner-action/scan@v1
        with:
          scan-args: --file=composer.lock
        continue-on-error: true # Muestra los errores en consola pero no traba la demo bruscamente si querés ver el reporte final