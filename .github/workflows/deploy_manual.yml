name: Laravel CI/CD Pipeline

on:
  # 🕹️ Esto habilita el botón manual en la interfaz de GitHub Actions
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # ==========================================
  # BLOQUE 1: INTEGRACIÓN CONTINUA (TESTS Y SEGURIDAD)
  # ==========================================
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Automatiza la descarga de la rama que elijas en el menú desplegable
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel tests
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env
          php artisan migrate --force
          php artisan test

  # ==========================================
  # BLOQUE 2: DESPLIEGUE CONTROLADO EN RENDER
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: test-and-security # Sigue exigiendo que los tests pasen en la rama elegida

    steps:
      - name: Inform Despliegue en Consola
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          ENV_NAME: ${{ github.event.inputs.environment }}
        run: |
          echo "Iniciando despliegue manual..."
          echo "Rama seleccionada para Render: $BRANCH_NAME"
          echo "Entorno seleccionado: $ENV_NAME"

      - name: Trigger Render Deploy Hook (Specific Branch)
        # 💡 Le agregamos al curl el parámetro (?ref=) con la rama dinámica elegida por el usuario
        run: |
          curl -fX POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&ref=${{ github.ref_name }}"
