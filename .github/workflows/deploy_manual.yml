# ==========================================
  # BLOQUE 2: DESPLIEGUE CONTROLADO (ZEABUR)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: pre-check # Solo ejecuta el despliegue si los tests en la rama elegida pasan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inform Despliegue en Consola
        # Protegemos las variables pasándolas mediante el contexto env
        env:
          REF_NAME: ${{ github.ref_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          echo "Iniciando despliegue manual..."
          echo "Rama seleccionada: $REF_NAME"
          echo "Entorno seleccionado: $ENVIRONMENT"

      - name: Deploy Selected Branch to Zeabur
        # 💡 Usamos npx directo para ejecutar la herramienta sin descargar scripts rotos por curl
        run: npx --yes @zeabur/cli deploy --all
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}