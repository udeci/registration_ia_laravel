name: 🚀 Manual Release Deploy

on:
  # Esto habilita el disparador manual en la interfaz de GitHub Actions
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # ==========================================
  # BLOQUE 1: RE-VERIFICACIÓN DE SEGURIDAD Y TESTS
  # ==========================================
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Actions/checkout toma automáticamente la rama que elijas en la interfaz web
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Tests before Deploy
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env
          php artisan migrate --force
          php artisan test

  # ==========================================
  # BLOQUE 2: DESPLIEGUE CONTROLADO (ZEABUR)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: pre-check # Solo ejecuta el despliegue si los tests en la rama elegida pasan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inform Despliegue en Consola
        # Mostramos en los logs qué rama y qué entorno seleccionó el usuario
        env:
          REF_NAME: ${{ github.ref_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          echo "Iniciando despliegue manual..."
          echo "Rama seleccionada: $REF_NAME"
          echo "Entorno seleccionado: $ENVIRONMENT"

      - name: Install Zeabur CLI
        run: curl -s https://zeabur.com/install.sh | bash

      - name: Deploy Selected Branch to Zeabur
        run: |
          export PATH="$HOME/.zeabur/bin:$PATH"
          # El CLI de Zeabur tomará el código de la rama actual que bajó el checkout
          zeabur deploy --all
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}