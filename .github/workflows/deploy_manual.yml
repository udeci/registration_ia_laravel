name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ main ] # Solo hace deploy cuando los cambios llegan a la rama principal

jobs:
  # ==========================================
  # BLOQUE 1: INTEGRACIÓN CONTINUA (TESTS Y SEGURIDAD)
  # ==========================================
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel tests
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env
          php artisan migrate --force
          php artisan test

  # ==========================================
  # BLOQUE 2: DESPLIEGUE CONTINUO EN RENDER
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: test-and-security # OBLIGATORIO: Solo corre si el bloque de tests terminó en verde

    steps:
      - name: Trigger Render Deploy Hook
        # Ejecutamos un curl simple pasando la URL secreta que nos da Render
        run: |
          curl -fX POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
