name: Code Reviewer

on:
  push:
    branches: [ main ]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Trae los últimos dos commits para poder calcular el diff

      - name: Get Code Diff
        run: |
          # Filtramos para que solo analice archivos de código de Laravel (.php)
          git diff HEAD~1 HEAD -- '*.php' > laravel_changes.diff || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenAI SDK
        run: pip install openai

      - name: Run AI Audit
        env:
          # Pasamos el Secret de GitHub al entorno del script de Python
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<EOF
          import os
          from openai import OpenAI

          # Inicializar cliente usando la variable de entorno protegida
          client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))

          if not os.path.exists("laravel_changes.diff") or os.path.getsize("laravel_changes.diff") == 0:
              print("No se detectaron cambios en archivos PHP para auditar.")
              exit(0)

          with open("laravel_changes.diff", "r") as f:
              diff_content = f.read()

          prompt = f"""
          Actuá como un Auditor de Seguridad Senior experto en Laravel. 
          Analizá el siguiente diff de código PHP e identificá de forma concisa:
          1. Vulnerabilidades (SQL Injection, XSS, Mass Assignment, falta de Middlewares).
          2. Malas prácticas de arquitectura (Lógica de negocio en controladores en vez de Services/Models).
          3. Nivel de Riesgo (Bajo / Medio / Alto).

          Diff de código:
          {diff_content}
          """

          response = client.chat.completions.create(
              model="gpt-4o-mini", # Rápido y económico para CI/CD
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2
          )

          print("\n" + "="*40)
          print("🚨 REPORTE DE AUDITORÍA IA - LARAVEL 🚨")
          print("="*40)
          print(response.choices[0].message.content)
          EOF